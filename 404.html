  <script src="./js/script.js"></script>
  <script>

    var topValue = -100; 

    if (window.innerWidth < 1025) { 
        topValue = -100; 
    }

    if (window.innerWidth < 405) { 
        topValue = 200; 
    }

    gsap.to("h1", 2, {
      top: topValue,
      ease: "power4.inOut",
      stagger: {
        amount: 0.125,
      },
    });

    gsap.to(".h1-revealer", 0.1, {
      delay: 2,
      display: "none",
    });

    gsap.from(".home-img", 1, {
      delay: 2,
      scale: 0,
      ease: "power4.inOut",
    });

    gsap.to("a#logo", 0.1, {
      delay: 2,
      opacity: 0,
    });

    gsap.from(".blob", 2, {
      delay: 2,
      scale: 0,
      ease: "power3.inOut",
    });
